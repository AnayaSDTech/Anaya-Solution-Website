<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANAYA Logo Preview</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { --ink: #05070D; --ink-2: #0A0F1C; --paper: #FFFFFF; --paper-2: #F4F6FA; --muted: #8B95AD; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--ink); color: #C9D0DE; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { color: #F5F7FB; font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .tile { border-radius: 16px; padding: 40px 24px; display: grid; place-items: center; min-height: 180px; position: relative; }
  .tile span { position: absolute; top: 12px; left: 16px; font: 12px ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
  .dark { background: var(--ink-2); border: 1px solid rgb(255 255 255 / .08); }
  .light { background: var(--paper); color: #3D4659; }
  .light2 { background: var(--paper-2); color: #0B1020; }
  .logo { width: min(100%, 320px); height: auto; }
  .sizes { display: flex; gap: 20px; align-items: end; flex-wrap: wrap; justify-content: center; }
  .mono-dark { color: #F5F7FB; }
  .mono-light { color: #0B1020; }
  /* Mono logo tinted with CSS: the SVG is used as a mask, so it takes any colour */
  .mask { width: min(100%, 320px); aspect-ratio: 228 / 60; background: #C9D0DE;
          -webkit-mask: url(anaya-logo-mono.svg) center / contain no-repeat;
                  mask: url(anaya-logo-mono.svg) center / contain no-repeat; }
</style>
</head>
<body>
<main>
  <h1>ANAYA Solutions — logo preview</h1>
  <p>Open this file in a browser. The source SVGs are in this folder.</p>
  <div class="grid">
    <div class="tile dark"><span>Primary · dark</span><img class="logo" src="anaya-logo.svg" alt="ANAYA Solutions"></div>
    <div class="tile light"><span>Primary · light</span><img class="logo" src="anaya-logo-light-bg.svg" alt="ANAYA Solutions"></div>
    <div class="tile dark"><span>Mark</span><img src="anaya-mark.svg" alt="ANAYA mark" width="96" height="96"></div>
    <div class="tile light2"><span>Mark · light</span><img src="anaya-mark.svg" alt="ANAYA mark" width="96" height="96"></div>
    <div class="tile dark"><span>Favicon sizes</span>
      <div class="sizes">
        <img src="favicon.svg" alt="" width="64" height="64">
        <img src="favicon.svg" alt="" width="32" height="32">
        <img src="favicon.svg" alt="" width="16" height="16">
      </div>
    </div>
    <div class="tile dark"><span>Header size (32px high)</span><img src="anaya-logo.svg" alt="ANAYA Solutions" height="32"></div>
    <div class="tile dark mono-dark"><span>Mono · tinted via CSS mask</span><div class="mask" role="img" aria-label="ANAYA Solutions"></div></div>
    <div class="tile light"><span>Mobile header (28px)</span><img src="anaya-logo-light-bg.svg" alt="ANAYA Solutions" height="28"></div>
  </div>
</main>
</body>
</html>
